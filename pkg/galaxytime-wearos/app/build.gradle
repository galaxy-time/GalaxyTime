plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

android {
    compileSdk 34

    namespace "jp.lab75.galaxytime"

    defaultConfig {
        applicationId "jp.lab75.galaxytime"
        minSdk 33
        targetSdk 33
        versionCode 22
        versionName '0.22'
		versionNameSuffix 'RC1'
	}

    buildFeatures {
        viewBinding true
		compose true
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/atomicfu.kotlin_module']
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
	composeOptions {
		kotlinCompilerExtensionVersion "$compose_compiler_version"
	}
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.majorVersion
    }
	lint {
		quiet true
		abortOnError false
		ignoreWarnings true
		checkDependencies true
	}

}

dependencies {

	// implementation "io.ktor:ktor-client-core:$ktor_version"
	// implementation "io.ktor:ktor-client-cio:$ktor_version"

	implementation "androidx.core:core-splashscreen:1.0.1"
	implementation "androidx.wear.tiles:tiles:1.1.0"
	implementation "androidx.wear.tiles:tiles-material:1.1.0"
	implementation "com.google.android.horologist:horologist-compose-tools:0.4.8"
	implementation "com.google.android.horologist:horologist-tiles:0.4.8"
	implementation "androidx.wear.watchface:watchface-complications-data-source-ktx:1.1.1"


	// General Compose dependencies
	implementation "androidx.activity:activity-compose:$activity_compose_version"
	implementation "androidx.compose.ui:ui-tooling-preview:$compose_version"
	implementation "androidx.compose.foundation:foundation:$compose_version"
	implementation "androidx.compose.material:material-icons-extended:$compose_version"

	// Compose for Wear OS Dependencies
	implementation "androidx.wear.compose:compose-material:$wear_compose_version"

	// Foundation is additive, so you can use the standard version in your Wear OS app.
	implementation "androidx.wear.compose:compose-foundation:$wear_compose_version"

	// Compose preview annotations for Wear OS.
	implementation "androidx.wear.compose:compose-ui-tooling:$wear_compose_version"

    // implementation libs.horologist.compose.tools
    // implementation libs.horologist.tiles

	implementation libs.androidx.compose.foundation
	implementation libs.androidx.compose.ui.tooling

    // Kotlin components
    // implementation libs.coil
    implementation libs.kotlinx.coroutines.core
    implementation libs.kotlinx.coroutines.android
    // implementation libs.kotlinx.coroutines.guava

	// Material components
	implementation libs.android.material

	implementation libs.androidx.core.splashscreen
	implementation libs.androidx.core.ktx
    implementation libs.androidx.activity.ktx
	implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.viewmodel.ktx
	implementation libs.androidx.wear

    implementation libs.wear.watchface
    implementation libs.wear.watchface.client
	implementation libs.wear.watchface.complications.data
	implementation libs.wear.watchface.complications.data.source
    implementation libs.wear.watchface.complications.rendering
    implementation libs.wear.watchface.data
    implementation libs.wear.watchface.editor
    implementation libs.wear.watchface.style
	implementation libs.appcompat
	implementation libs.preference
	implementation libs.play.services.location

	implementation 'com.github.cosinekitty:astronomy:2.1.19'
	implementation libs.androidx.wear.tooling.preview
	implementation libs.constraintlayout
	debugImplementation libs.androidx.ui.tooling
	// implementation libs.androidx.wear.tooling.preview
    // implementation libs.compose.ui.tooling.preview
    // debugImplementation libs.androidx.ui.tooling
}
