type Query {

  ping: String
  version: String

  time(zone: String): String
  zones: [Zone]
  zone( name:String, id: Int) : Zone
}

type Mutation {
  addZone(input: AddZoneInput!): Zone!
}

# Locations of astronomical objects in this api are based on the Equatorial coordinate system
# https://en.wikipedia.org/wiki/Equatorial_coordinate_system

# Geographical Distance calculations
# https://en.wikipedia.org/wiki/Geographical_distance

# astronomical object location type
type Location {
  id: ID!
  latitude: Float!
  longitude: Float!
  distance: Float!
}

# astronomical object definitionyarn
type Zone {
  #
  id: ID!
  name: String!
  #
  hx: String
  hy: String
  hz: String
  # dist to sund in AU
  dist: String 
  #
  mag: String
  elong: String
  con: String
  # ecliptic
  ecl_long: String
  ecl_lat: String
  # equatorial
  ra: String
  dec: String
  # horizontal
  azimuth: String
  altitude: String
}

input AddZoneInput {
  name: String!
}

# sun path on a planet
type SunPath {
  rise: String
  culmination: String
  set: String
}